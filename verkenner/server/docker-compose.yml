# Verkenner-sync met automatische HTTPS (Caddy).
# Vervang in de Caddyfile het adres door jouw domein (of het sslip.io-adres).
services:
  sync:
    image: python:3.12-alpine
    restart: unless-stopped
    command: python /app/verkenner_sync.py
    environment:
      VERKENNER_HOST: 0.0.0.0
      VERKENNER_DATA: /data
    volumes:
      - ./verkenner_sync.py:/app/verkenner_sync.py:ro
      - ./data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
    depends_on: [sync]
